[pytest]
# `pythonpath = .` puts the repo root on sys.path so tests import `core` without an
# editable install. Requires pytest >= 7.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
markers =
    slow: deselect with -m "not slow"
filterwarnings =
    error
